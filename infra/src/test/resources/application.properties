spring.application.name=sistemajcb

spring.datasource.url=${JCB_TEST_DB_URL}
spring.datasource.username=${JCB_TEST_DB_USERNAME}
spring.datasource.password=${JCB_TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# Força o mapeamento do Swagger UI e dos docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packagesToScan=com.br.application.rest
api.security.token.secret=${JCB_TEST_JWT_SECRET}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
